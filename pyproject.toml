[project]
name = "colombia-datos-mcp"
dynamic = ["version"]
description = "Servidor MCP unificado para datos públicos de Colombia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# fastmcp 4 movió `ToolResult` de `fastmcp.tools.tool` a `fastmcp.tools`, así
# que `>=2.0` a secas dejaba instalar una versión con la que el servidor no
# arrancaba. El import prueba las dos rutas; esto deja constancia del motivo.
dependencies = ["fastmcp>=2.0", "httpx>=0.27"]

[project.scripts]
colombia-datos-mcp = "colombia_datos_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/colombia_datos_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/colombia_datos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# La suite de contrato golpea la API viva: se pide a propósito con -m contrato.
addopts = "-m 'not contrato'"
markers = ["contrato: comprueba supuestos contra la API viva (requiere red)"]
